[tools]
node = "24"
bun = "latest"
go = "latest"
uv = "latest"
process-compose = "latest"
"pipx:posting" = "latest"
# 0.44.1で入ったhost query forwardingにより端末色問い合わせ応答がprompt/Codex TUIへ漏れ0.44.0に固定していた。
# zjstatus v0.25.0(zellij-tile 0.45.0ビルド)と揃えるため0.45.1へ。漏れが再発したらexplicit_theme_hueで対処し、駄目なら0.44.0へ戻す
"aqua:zellij-org/zellij" = "0.45.1"

# npmパッケージ
"npm:@antfu/ni" = "latest"
"npm:@devcontainers/cli" = "latest"
"npm:hunkdiff" = "0.17.7"              # ターミナル差分レビュー
"npm:@rivolink/leaf" = "latest"     # ターミナルMDビューア
"npm:ntn" = "latest"                # notion CLI

# AIコードアシスタント
"npm:@openai/codex" = "latest"
# Claude Code は postinstall でプラットフォーム固有バイナリを配置するため、当該パッケージだけ実行を許可する
"npm:@anthropic-ai/claude-code" = { version = "latest", allow_builds = ["@anthropic-ai/claude-code"] }
"npm:@github/copilot" = "latest"

# 言語サーバー（LSP）
"aqua:LuaLS/lua-language-server" = "latest"
# aqua レジストリが darwin/arm64 で macos-x64 アセットを選ぶため ubi に切替
"ubi:tree-sitter/tree-sitter" = "latest"
"npm:typescript-language-server" = "latest"
"npm:@astrojs/language-server" = "latest"
"npm:vscode-langservers-extracted" = "latest"
"npm:@tailwindcss/language-server" = "latest"

# フォーマッター
"aqua:JohnnyMorganz/StyLua" = "latest"
"aqua:tamasfe/taplo" = "latest"
"npm:prettier" = "latest"

[settings]
minimum_release_age = "7d"
# 公式ベンダー直販かつモデル追随のため即日取得したい2つだけ7dルールから除外する
minimum_release_age_excludes = [
  "npm:@openai/codex",
  "npm:@anthropic-ai/claude-code",
]
