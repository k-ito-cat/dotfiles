{{- /* chezmoi:modify-template */ -}}
{{- $managed := `# chezmoi:managed:start
# -------------------------------------------------------------------
# Core
# -------------------------------------------------------------------

personality = "pragmatic"
sandbox_mode = "workspace-write"
approval_policy = "on-request"
service_tier = "default"

[memories]
use_memories = false
generate_memories = false

[sandbox_workspace_write]
# 起動したPJと、その一部として置かれたsymlink先を編集可能にする。
# 複数PJで共有するchezmoi、project-documents、cli-kitも追加で許可する。
# chezmoi apply の反映先となる管理ディレクトリも許可する。
writable_roots = [
  "/Users/ito_kyohei/.local/share/chezmoi",
  "/Users/ito_kyohei/src/github.com/k-ito-cat/project-documents",
  "/Users/ito_kyohei/src/github.com/k-ito-cat/cli-kit",
  "/Users/ito_kyohei/.agents/skills",
  "/Users/ito_kyohei/.claude",
  "/Users/ito_kyohei/.codex",
  "/Users/ito_kyohei/.config/chezmoi",
  "/Users/ito_kyohei/.config/hunk",
  "/Users/ito_kyohei/.config/karabiner",
  "/Users/ito_kyohei/.config/lazysql",
  "/Users/ito_kyohei/.config/leaf",
  "/Users/ito_kyohei/.config/mise",
  "/Users/ito_kyohei/.config/navi",
  "/Users/ito_kyohei/.config/nvim",
  "/Users/ito_kyohei/.config/process-compose",
  "/Users/ito_kyohei/.config/sheldon",
  "/Users/ito_kyohei/.config/wezterm",
  "/Users/ito_kyohei/.config/yazi",
  "/Users/ito_kyohei/.config/zellij",
  "/Users/ito_kyohei/.config/zsh",
  "/Users/ito_kyohei/.config/zsh-abbr",
  "/Users/ito_kyohei/.local/bin",
  "/Users/ito_kyohei/.local/share/navi",
]
network_access = false

[ui]
language = "ja"

# -------------------------------------------------------------------
# MCP servers
# -------------------------------------------------------------------

[mcp_servers.notion]
enabled = false
url = "https://mcp.notion.com/mcp"

[mcp_servers.figma]
enabled = false
url = "https://mcp.figma.com/mcp"

` -}}

{{- if eq .chezmoi.os "linux" -}}
{{- $managed = printf `%s
# FIXME: Windows/WSL環境依存のパスを直書きしている。
# 将来的にはPencil MCPの安定した起動方法が分かったら置き換える。
[mcp_servers.pencil]
command = "/mnt/c/Users/kyohy/AppData/Local/Programs/Pencil/resources/app.asar.unpacked/out/mcp-server-windows-x64.exe"
args = ["--app", "desktop"]

` $managed -}}
{{- end -}}

{{- $managed = printf `%s
# -------------------------------------------------------------------
# Plugins
# -------------------------------------------------------------------

[plugins."gmail@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

# -------------------------------------------------------------------
# TUI
# -------------------------------------------------------------------

[tui]
status_line = ["model-with-reasoning", "current-dir", "weekly-limit", "context-used"]
status_line_use_colors = true
# chezmoi:managed:end` $managed -}}
{{- /* マーカー対が有れば領域を置換、無ければ末尾に $managed を追記（マーカーごと書かれるので手動マーカー不要） */ -}}
{{- if regexMatch "(?s)# chezmoi:managed:start.*?# chezmoi:managed:end" .chezmoi.stdin -}}
{{- .chezmoi.stdin | replaceAllRegex "(?s)# chezmoi:managed:start.*?# chezmoi:managed:end" $managed -}}
{{- else if .chezmoi.stdin -}}
{{- printf "%s\n\n%s\n" (trimSuffix "\n" .chezmoi.stdin) $managed -}}
{{- else -}}
{{- printf "%s\n" $managed -}}
{{- end -}}
